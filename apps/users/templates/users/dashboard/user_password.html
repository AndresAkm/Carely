{% extends 'core/dashboard_base.html' %}
{% block dashboard_title %}Cambiar contraseña{% endblock %}
{% block dashboard_content %}<div class="dashboard-page-header"><div><h1 class="dashboard-heading">Cambiar contraseña</h1><p class="dashboard-muted">Actualiza la contraseña de {{ object.email }}.</p></div><a href="{% url 'dashboard:user_list' %}" class="btn btn-carely-outline">Volver</a></div><div class="dashboard-card dashboard-form-card"><div class="dashboard-card-body"><form method="post">{% csrf_token %}{{ form.as_p }}<div class="d-flex justify-content-end mt-4"><button class="btn btn-carely-primary">Guardar contraseña</button></div></form></div></div>{% endblock %}
