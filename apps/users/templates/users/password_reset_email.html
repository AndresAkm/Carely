<!doctype html>
<html lang="es">

<body style="margin:0;background:#f7f1f6;font-family:Arial,sans-serif;color:#29253a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
        style="padding:32px 12px;background:#f7f1f6;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
                    style="max-width:560px;background:#fff;border-radius:24px;box-shadow:0 16px 40px rgba(66,55,90,.14);overflow:hidden;">
                    <tr>
                        <td style="height:7px;background:linear-gradient(90deg,#e8609b,#5b8def);"></td>
                    </tr>
                    <tr>
                        <td style="padding:40px;text-align:center;">
                            <div style="margin:0 auto 28px;color:#20202a;font-size:30px;font-weight:700;letter-spacing:-1px;"> 
                                Carely
                            </div>
                            <h1 style="margin:0 0 12px;font-size:26px;">Restablece tu contraseña</h1>
                            <p style="margin:0 0 28px;color:#6f6a7d;font-size:16px;line-height:1.6;">
                                Hola {{ user.first_name|default:user.email }}, recibimos una solicitud para cambiar la
                                contraseña de tu cuenta Carely.
                            </p>
                            <a
                                href="{{ protocol }}://{{ domain }}{% url 'users:password_reset_confirm' uidb64=uid token=token %}"
                                style="display:inline-block;padding:14px 26px;border-radius:12px;background:#e8609b;color:#fff;text-decoration:none;font-weight:bold;">Crear
                                nueva contraseña
                            </a>
                            <p style="margin:28px 0 0;color:#999;font-size:13px;line-height:1.5;">
                                Este enlace es temporal. Si no solicitaste este cambio, puedes ignorar este correo.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
