{% extends 'core/dashboard_base.html' %}
{% block dashboard_title %}Eliminar categoría{% endblock %}
{% block dashboard_content %}<div class="dashboard-card dashboard-confirm-card text-center"><div class="dashboard-card-body"><div class="confirm-icon"><i class="bi bi-trash"></i></div><h1 class="dashboard-heading">¿Eliminar categoría?</h1><p class="dashboard-muted">Esta acción eliminará <strong>{{ object.name }}</strong> y sus productos asociados.</p><form method="post">{% csrf_token %}<a href="{% url 'dashboard:category_list' %}" class="btn btn-carely-outline">Cancelar</a><button type="submit" class="btn btn-danger">Eliminar categoría</button></form></div></div>{% endblock %}
