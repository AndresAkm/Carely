<!doctype html>
<html lang="es">
<body style="margin:0;background:#f7f1f6;font-family:Arial,sans-serif;color:#29253a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 12px;background:#f7f1f6;">
        <tr><td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border-radius:24px;box-shadow:0 16px 40px rgba(66,55,90,.14);overflow:hidden;">
                <tr><td style="height:7px;background:linear-gradient(90deg,#e8609b,#5b8def);"></td></tr>
                <tr><td style="padding:40px;text-align:left;">
                    <div style="margin:0 0 24px;color:#20202a;font-size:26px;font-weight:700;letter-spacing:-1px;">Carely</div>
                    <h1 style="margin:0 0 16px;font-size:22px;">Respondimos tu mensaje</h1>
                    <p style="margin:0 0 20px;color:#6f6a7d;font-size:16px;line-height:1.6;">Hola {{ name }}, gracias por escribirnos. Esta es la respuesta de nuestro equipo:</p>
                    <div style="padding:18px 20px;border-radius:14px;background:#f5f0f8;font-size:15px;line-height:1.6;white-space:pre-line;">{{ reply }}</div>
                    <div style="margin:28px 0 8px;color:#6f6a7d;font-size:13px;text-transform:uppercase;letter-spacing:.08em;">Tu mensaje original</div>
                    <div style="padding:18px 20px;border-radius:14px;background:#faf8fb;border:1px solid #ece6f1;font-size:14px;line-height:1.6;color:#6f6a7d;white-space:pre-line;">{{ message }}</div>
                    <p style="margin:28px 0 0;color:#999;font-size:13px;line-height:1.5;">Si necesitas agregar algo, responde directamente a este correo.</p>
                    <p style="margin:20px 0 0;color:#6f6a7d;font-size:13px;line-height:1.5;">
                        {{ admin.get_full_name|default:admin.email }}<br>
                        El equipo de Carely
                    </p>
                </td></tr>
            </table>
        </td></tr>
    </table>
</body>
</html>
