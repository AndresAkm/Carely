{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Carely - Cuidado Personal{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Carely - Tu tienda de cuidado personal de confianza. Productos originales para el cuidado de tu piel, cuerpo y bienestar.{% endblock %}">

    <link rel="icon" type="image/webp" href="{% static 'core/images/carely-logo.webp' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'css/variables.css' %}?v=1" rel="stylesheet">
    <link href="{% static 'css/base.css' %}" rel="stylesheet">
    <link href="{% static 'css/layout.css' %}?v=10" rel="stylesheet">
    <link href="{% static 'css/animations.css' %}" rel="stylesheet">
    <link href="{% static 'css/theme.css' %}" rel="stylesheet">
    <link href="{% static 'css/contact.css' %}?v=1" rel="stylesheet">
    <link href="{% static 'css/loading.css' %}?v=2" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="page-wrapper">
        {% block messages %}{% include 'messages.html' %}{% endblock %}

        {% block content %}{% endblock %}
    </div>

    {% include 'components/floating_cart.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/alerts.js' %}"></script>
    <script src="{% static 'js/loading.js' %}?v=2"></script>
    <script src="{% static 'js/navbar.js' %}?v=2"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <script src="{% static 'js/contact.js' %}?v=1"></script>
    <script
        src="{% static 'js/tour_loader.js' %}?v=1"
        data-driver-css="{% static 'vendors/driver.js/driver.css' %}"
        data-driver-js="{% static 'vendors/driver.js/driver.js.iife.js' %}"
        data-tour-css="{% static 'css/tour.css' %}?v=1"
        data-tour-js="{% static 'js/tour.js' %}?v=1"
    ></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
