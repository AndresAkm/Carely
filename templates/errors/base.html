{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block error_title %}Página no encontrada{% endblock %} - Carely</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'css/variables.css' %}" rel="stylesheet">
    <link href="{% static 'css/base.css' %}" rel="stylesheet">
    <link href="{% static 'css/layout.css' %}" rel="stylesheet">
    <link href="{% static 'css/animations.css' %}" rel="stylesheet">
    <link href="{% static 'core/css/errors.css' %}?v=1" rel="stylesheet">
</head>
<body class="error-page {% block error_class %}{% endblock %}">
    <div class="error-decor" aria-hidden="true">
        <span class="error-decor__blob error-decor__blob--primary"></span>
        <span class="error-decor__blob error-decor__blob--secondary"></span>
        <span class="error-decor__ring error-decor__ring--one"></span>
        <span class="error-decor__ring error-decor__ring--two"></span>
        <span class="error-decor__dot error-decor__dot--one"></span>
        <span class="error-decor__dot error-decor__dot--two"></span>
        <span class="error-decor__dot error-decor__dot--three"></span>
    </div>

    <main class="error-wrapper">
        <a href="{% url 'core:home' %}" class="error-logo" aria-label="Carely">
            <img src="{% static 'core/images/carely-logo.svg' %}" alt="Carely" class="error-logo__image">
        </a>

        {% block error_content %}
        {% endblock %}
    </main>

    <footer class="error-footer">
        <a href="{% url 'core:home' %}" class="error-footer__link">Inicio</a>
        <span class="error-footer__sep" aria-hidden="true">·</span>
        <a href="{% url 'catalog:home' %}" class="error-footer__link">Catálogo</a>
        <span class="error-footer__sep" aria-hidden="true">·</span>
        <a href="{% url 'core:privacy' %}" class="error-footer__link">Términos y Privacidad</a>
    </footer>
</body>
</html>
